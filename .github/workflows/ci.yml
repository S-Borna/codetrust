name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    security-events: write

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            matrix:
                python-version: ["3.12", "3.13"]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ matrix.python-version }}-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint with ruff
              run: ruff check src/ tests/

            - name: Validate metrics (prevent doc drift)
              run: |
                  python scripts/generate_metrics.py
                  python scripts/validate_readme_metrics.py

            - name: Run tests with coverage
              run: pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

            - name: Generate SBOM (CycloneDX)
              if: matrix.python-version == '3.12'
              run: |
                  pip install cyclonedx-bom
                  cyclonedx-py environment -o sbom.json --output-format json

            - name: Upload SBOM artifact
              if: matrix.python-version == '3.12'
              uses: actions/upload-artifact@v6
              with:
                  name: sbom
                  path: sbom.json

    helm-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: "v3.14.0"

            - name: Lint Helm chart
              run: helm lint deploy/helm/codetrust

            - name: Template Helm chart (validate rendering)
              run: |
                  helm template codetrust deploy/helm/codetrust \
                    --set image.tag=ci-test \
                    --set config.databaseUrl=sqlite:///test.db \
                    > /dev/null

            - name: Template with production values
              run: |
                  helm template codetrust deploy/helm/codetrust \
                    --set replicaCount=3 \
                    --set image.tag=v2.0.0 \
                    --set autoscaling.enabled=true \
                    --set autoscaling.minReplicas=2 \
                    --set autoscaling.maxReplicas=10 \
                    > /dev/null

    extension-build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: extension/package-lock.json

            - name: Install dependencies
              working-directory: extension
              run: npm ci

            - name: Type-check
              working-directory: extension
              run: npx tsc --noEmit

            - name: Build
              working-directory: extension
              run: npm run compile

    codetrust-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: lint-and-test
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Check API health
              id: api_health
              continue-on-error: true
              run: |
                  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://codetrust-api-production.up.railway.app/v1/status" || echo "000")
                  echo "status=$HTTP_CODE" >> $GITHUB_OUTPUT

            - name: Run CodeTrust Scan (API)
              if: steps.api_health.outputs.status == '200'
              uses: ./
              with:
                  scan-type: "static"
                  language: "python"
                  path: "src/"
                  fail-on: "block"
                  sarif-file: "codetrust-results.sarif"

            - name: Run CodeTrust Scan (Local Fallback)
              if: steps.api_health.outputs.status != '200'
              run: |
                  echo "::warning::CodeTrust API unreachable — running local scan"
                  python -m src.cli scan src/ --json

            - name: Upload SARIF
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: codetrust-results.sarif
              continue-on-error: true
