name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    security-events: write

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint with ruff
              run: ruff check src/ tests/

            - name: Run tests
              run: pytest tests/ -v --tb=short

    codetrust-scan:
        runs-on: ubuntu-latest
        needs: lint-and-test
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Check API health
              id: api_health
              continue-on-error: true
              run: |
                  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://codetrust-api-production.up.railway.app/v1/status" || echo "000")
                  echo "status=$HTTP_CODE" >> $GITHUB_OUTPUT

            - name: Run CodeTrust Scan (API)
              if: steps.api_health.outputs.status == '200'
              uses: ./
              with:
                  scan-type: "static"
                  language: "python"
                  path: "src/"
                  fail-on: "block"
                  sarif-file: "codetrust-results.sarif"

            - name: Run CodeTrust Scan (Local Fallback)
              if: steps.api_health.outputs.status != '200'
              run: |
                  echo "::warning::CodeTrust API unreachable — running local scan"
                  python -m src.cli scan src/ --json

            - name: Upload SARIF
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: codetrust-results.sarif
              continue-on-error: true
