name: CodeTrust Action Selftest

"on":
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  action-smoke:
    name: Composite action smoke (PASS/BLOCK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create fixtures
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path(".codetrust_action_selftest"); p.mkdir(exist_ok=True); token="<"+"<EOF"; (p/"pass.py").write_text("x = 1\n", encoding="utf-8"); (p/"block.py").write_text(f"x = \"{token}\"\n", encoding="utf-8")'

      - name: Run action (PASS)
        id: pass
        uses: ./.
        with:
          scan-type: static
          fail-on: block
          language: python
          path: .codetrust_action_selftest/pass.py
          sarif-file: codetrust-results.sarif
          pr-mode: never
          pr-comment: never
          new-findings-only: never
          api-url: https://codetrust-api-production.up.railway.app

      - name: Verify outputs (PASS)
        shell: bash
        run: |
          test -f codetrust-results.sarif

      - name: Run action (BLOCK)
        id: block
        continue-on-error: true
        uses: ./.
        with:
          scan-type: static
          fail-on: block
          language: python
          path: .codetrust_action_selftest/block.py
          sarif-file: codetrust-results.sarif
          pr-mode: never
          pr-comment: never
          new-findings-only: never
          api-url: https://codetrust-api-production.up.railway.app

      - name: Verify expected failure (BLOCK)
        shell: bash
        run: |
          if [ "${{ steps.block.outcome }}" != "failure" ]; then
            echo "Expected BLOCK run to fail, but outcome was: ${{ steps.block.outcome }}"
            exit 1
          fi

  action-cloud-api:
    name: Composite action cloud API smoke (optional)
    runs-on: ubuntu-latest
    env:
      CODETRUST_API_KEY: ${{ secrets.CODETRUST_API_KEY }}
      CODETRUST_API_URL: ${{ secrets.CODETRUST_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create fixtures
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('.codetrust_action_selftest'); p.mkdir(exist_ok=True); (p/'cloud.py').write_text('x = 1\n', encoding='utf-8')"

      - name: Skip (no API key configured)
        if: ${{ env.CODETRUST_API_KEY == '' }}
        shell: bash
        run: |
          echo "::notice::CODETRUST_API_KEY is not configured for this repo — skipping cloud API selftest."

      - name: Run action (cloud API)
        if: ${{ env.CODETRUST_API_KEY != '' }}
        uses: ./.
        with:
          scan-type: static
          fail-on: block
          language: python
          path: .codetrust_action_selftest/cloud.py
          sarif-file: codetrust-results.sarif
          pr-mode: never
          pr-comment: never
          new-findings-only: never
          api-url: ${{ env.CODETRUST_API_URL || 'https://codetrust-api-production.up.railway.app' }}
          api-key: ${{ env.CODETRUST_API_KEY }}

  pr-comment-idempotent:
    name: PR comment idempotence (PR only)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create fixture
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('.codetrust_action_selftest'); p.mkdir(exist_ok=True); token='<'+'<EOF'; (p/'pr.py').write_text('x = 1\n', encoding='utf-8'); (p/'pass.py').write_text('x = 1\n', encoding='utf-8'); (p/'block.py').write_text('x = \\\"'+token+'\\\"\n', encoding='utf-8')"

      - name: Run action (comment 1)
        uses: ./.
        with:
          scan-type: static
          fail-on: never
          language: python
          path: .codetrust_action_selftest/pr.py
          sarif-file: ""
          pr-mode: always
          pr-comment: always
          new-findings-only: never
          api-url: https://codetrust-api-production.up.railway.app

      - name: Run action (comment 2)
        uses: ./.
        with:
          scan-type: static
          fail-on: never
          language: python
          path: .codetrust_action_selftest/pr.py
          sarif-file: ""
          pr-mode: always
          pr-comment: always
          new-findings-only: never
          api-url: https://codetrust-api-production.up.railway.app

      - name: Assert single CodeTrust comment block
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = '<!-- codetrust-scan:start -->';
            const matches = comments.filter(c => typeof c.body === 'string' && c.body.includes(marker));
            if (matches.length !== 1) {
              core.setFailed(`Expected exactly 1 CodeTrust comment, found ${matches.length}`);
            }
