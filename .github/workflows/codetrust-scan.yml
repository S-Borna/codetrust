name: CodeTrust Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  codetrust-scan:
    name: CodeTrust Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for diff

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CodeTrust
        run: pip install httpx

      - name: Install local CodeTrust (fallback)
        run: pip install -e ".[dev]"

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACM ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(py|js|ts|go|rs|java|sh|sql|yml|yaml|toml)$' || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACM HEAD~1 HEAD | grep -E '\.(py|js|ts|go|rs|java|sh|sql|yml|yaml|toml)$' || true)
          fi
          DELIM="ghadelim_$(date +%s)"
          echo "files<<${DELIM}" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "${DELIM}" >> $GITHUB_OUTPUT

      - name: Check API health
        id: api_health
        continue-on-error: true
        run: |
          API_URL="${CODETRUST_API_URL:-https://codetrust-api-production.up.railway.app}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$API_URL/v1/status" || echo "000")
          echo "status=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" = "200" ]; then
            echo "API is reachable"
          else
            echo "::warning::CodeTrust API unreachable (HTTP $HTTP_CODE) — falling back to local scan"
          fi

      - name: Run CodeTrust Scan (API)
        id: scan_api
        if: steps.api_health.outputs.status == '200'
        env:
          CODETRUST_API_URL: ${{ secrets.CODETRUST_API_URL || 'https://codetrust-api-production.up.railway.app' }}
          CODETRUST_API_KEY: ${{ secrets.CODETRUST_API_KEY }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: python action/scan.py

      - name: Run CodeTrust Scan (Local Fallback)
        id: scan_local
        if: steps.api_health.outputs.status != '200'
        run: |
          echo "::notice::Running local CodeTrust scan (API unavailable)"
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No changed files to scan"
            exit 0
          fi
          python -m src.cli scan $FILES --json

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('codetrust-report.md')) return;
            const body = fs.readFileSync('codetrust-report.md', 'utf8');

            // Find existing CodeTrust comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.includes('<!-- codetrust-scan -->')
            );

            const commentBody = `<!-- codetrust-scan -->\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
