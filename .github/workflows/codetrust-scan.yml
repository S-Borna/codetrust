name: CodeTrust Scan
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  codetrust:
    name: CodeTrust Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install CodeTrust
        run: pip install .

      - name: Scan changed files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="HEAD~1"
          fi

          FILES=$(git diff --name-only --diff-filter=ACM "$BASE_SHA" "${{ github.sha || 'HEAD' }}" \
            | grep -E '\.(py|js|ts|jsx|tsx|go|rs)$' \
            | grep -v 'src/rules/' \
            | grep -v 'src/templates/' \
            | grep -v 'node_modules/' \
            | head -50 \
            || true)

          if [ -n "$FILES" ]; then
            echo "Scanning $(echo "$FILES" | wc -l | tr -d ' ') files..."
            echo "$FILES" | xargs codetrust scan --no-verify-imports --no-verify-signatures
          else
            echo "No scannable source files changed."
          fi
