name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint
              run: ruff check src/ tests/

            - name: Test with coverage
              run: pytest tests/ -v --tb=short --cov=src --cov-fail-under=80

            - name: Generate SBOM (CycloneDX)
              run: |
                  pip install cyclonedx-bom
                  cyclonedx-py environment -o sbom.json --output-format json

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sbom
                  path: sbom.json

    build-pypi:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install build tools
              run: pip install build

            - name: Build package
              run: python -m build

            - name: Upload PyPI artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: pypi-distributions
                  path: dist/

    build-vsix:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: extension/package-lock.json

            - name: Install dependencies
              working-directory: extension
              run: npm ci

            - name: Build extension
              working-directory: extension
              run: npm run compile

            - name: Package VSIX
              working-directory: extension
              run: npx @vscode/vsce package

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: vsix
                  path: extension/*.vsix

    create-release:
        needs: [verify, build-pypi, build-vsix]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - name: Download SBOM
              uses: actions/download-artifact@v4
              with:
                  name: sbom

            - name: Download PyPI distributions
              uses: actions/download-artifact@v4
              with:
                  name: pypi-distributions
                  path: dist/

            - name: Download VSIX
              uses: actions/download-artifact@v4
              with:
                  name: vsix
                  path: vsix/

            - name: Extract version from tag
              id: version
              run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      sbom.json
                      dist/*.tar.gz
                      dist/*.whl
                      vsix/*.vsix
                  body: |
                      ## Install

                      **CLI / Python:**
                      ```bash
                      pip install codetrust==${{ steps.version.outputs.version }}
                      ```

                      **VS Code Extension:**
                      Search "CodeTrust" in the Extensions marketplace, or:
                      ```
                      code --install-extension SaidBorna.codetrust
                      ```

                      **GitHub Action:**
                      ```yaml
                      - uses: S-Borna/codetrust@v${{ steps.version.outputs.version }}
                      ```

                      ---
                      *PyPI and Marketplace publishing is done manually after verifying the release artifacts.*
