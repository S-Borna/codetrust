name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    id-token: write # PyPI trusted publishing

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint
              run: ruff check src/ tests/

            - name: Test with coverage
              run: pytest tests/ -v --tb=short --cov=src --cov-fail-under=80

            - name: Generate SBOM (CycloneDX)
              run: |
                  pip install cyclonedx-bom
                  cyclonedx-py environment -o sbom.json --output-format json

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sbom
                  path: sbom.json

    publish-pypi:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: pypi
            url: https://pypi.org/project/codetrust/
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install build tools
              run: pip install build

            - name: Build package
              run: python -m build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1

            - name: Sign distribution with Sigstore
              uses: sigstore/gh-action-sigstore-python@v3
              with:
                  inputs: dist/*

            - name: Upload signed artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: signed-distributions
                  path: |
                      dist/*.sigstore.json
                      dist/*.tar.gz
                      dist/*.whl

    publish-vsix:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: extension/package-lock.json

            - name: Install dependencies
              working-directory: extension
              run: npm ci

            - name: Build extension
              working-directory: extension
              run: npm run compile

            - name: Package VSIX
              working-directory: extension
              run: npx @vscode/vsce package

            - name: Publish to VS Code Marketplace
              working-directory: extension
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: npx @vscode/vsce publish --pat "$VSCE_PAT"

            - name: Upload VSIX as release artifact
              uses: softprops/action-gh-release@v2
              with:
                  files: extension/*.vsix

    create-release:
        needs: [verify, publish-pypi, publish-vsix]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - name: Download SBOM
              uses: actions/download-artifact@v4
              with:
                  name: sbom

            - name: Download signed distributions
              uses: actions/download-artifact@v4
              with:
                  name: signed-distributions
                  path: signed/

            - name: Extract version from tag
              id: version
              run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      sbom.json
                      signed/*.sigstore.json
                  body: |
                      ## Install

                      **CLI / Python:**
                      ```bash
                      pip install codetrust==${{ steps.version.outputs.version }}
                      ```

                      **VS Code Extension:**
                      Search "CodeTrust" in the Extensions marketplace, or:
                      ```
                      code --install-extension SaidBorna.codetrust
                      ```

                      **GitHub Action:**
                      ```yaml
                      - uses: S-Borna/codetrust@v${{ steps.version.outputs.version }}
                      ```
