name: Trust DOD Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  trust-dod:
    name: Verify Trust DOD
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Trust DOD verification gate
        run: xvfb-run -a npm run verify:trust-dod
