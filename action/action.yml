name: "CodeTrust Scan"
description: "Scan code for anti-patterns, security issues, and hallucinated packages"
author: "CodeTrust"

branding:
  icon: "shield"
  color: "blue"

inputs:
  api-url:
    description: "CodeTrust API URL"
    required: false
    default: "https://api.codetrust.ai"
  api-key:
    description: "CodeTrust API key for cloud scanning"
    required: false
  files:
    description: "Space-separated list of files to scan (default: changed files)"
    required: false
  fail-on:
    description: "Fail threshold: 'block' (default), 'warn', or 'never'"
    required: false
    default: "block"
  fail-on-block:
    description: "Deprecated — use fail-on instead. Fail if BLOCK findings detected"
    required: false
    default: "true"
  scan-type:
    description: "Scan type: 'static' (default) or 'deep'"
    required: false
    default: "static"
  language:
    description: "Force language (python, javascript, typescript, go, rust). Auto-detected if omitted."
    required: false
  sarif:
    description: "Generate SARIF output file (true/false)"
    required: false
    default: "true"

outputs:
  verdict:
    description: "Scan verdict: PASS, WARN, or BLOCK"
  total-findings:
    description: "Total number of findings"
  blocks:
    description: "Number of BLOCK severity findings"
  report:
    description: "Path to the markdown report file"
  sarif-file:
    description: "Path to SARIF output file (if sarif input is true)"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install httpx

    - name: Run scan
      shell: bash
      env:
        CODETRUST_API_URL: ${{ inputs.api-url }}
        CODETRUST_API_KEY: ${{ inputs.api-key }}
        CHANGED_FILES: ${{ inputs.files }}
        CODETRUST_FAIL_ON: ${{ inputs.fail-on }}
        CODETRUST_SCAN_TYPE: ${{ inputs.scan-type }}
        CODETRUST_LANGUAGE: ${{ inputs.language }}
        CODETRUST_SARIF: ${{ inputs.sarif }}
      run: |
        if [ -z "$CHANGED_FILES" ]; then
          # Auto-detect changed files
          if [ -n "$GITHUB_BASE_REF" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACM origin/$GITHUB_BASE_REF...HEAD | grep -E '\.(py|js|ts|tsx|jsx|go|rs|java|sh|sql|yml|yaml)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACM HEAD~1 HEAD | grep -E '\.(py|js|ts|tsx|jsx|go|rs|java|sh|sql|yml|yaml)$' || true)
          fi
          export CHANGED_FILES
        fi
        python ${{ github.action_path }}/scan.py
        echo "verdict=$(grep -oP '(?<=Verdict: )\w+' codetrust-report.md || echo PASS)" >> $GITHUB_OUTPUT
        echo "sarif-file=codetrust-results.sarif" >> $GITHUB_OUTPUT
