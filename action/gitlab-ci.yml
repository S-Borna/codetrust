# CodeTrust GitLab CI Template
# Scans code for anti-patterns, security issues, and hallucinated packages.
#
# Usage:
#   Include this template in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/s-borna/codetrust/main/action/gitlab-ci.yml'
#
#   Or copy this file into your repo and include locally:
#
#   include:
#     - local: 'action/gitlab-ci.yml'
#
# Variables:
#   CODETRUST_API_KEY    — API key (store in CI/CD Settings > Variables, masked)
#   CODETRUST_API_URL    — API endpoint (default: https://api.codetrust.ai)
#   CODETRUST_FAIL_ON    — Failure threshold: block (default), warn, or never
#   CODETRUST_SCAN_TYPE  — Scan type: static (default) or deep
#   CODETRUST_LANGUAGE   — Force language (auto-detected if empty)
#   CODETRUST_SCAN_PATH  — Path to scan (default: .)

.codetrust-scan:
  image: python:3.12-slim
  variables:
    CODETRUST_API_URL: "https://api.codetrust.ai"
    CODETRUST_FAIL_ON: "block"
    CODETRUST_SCAN_TYPE: "static"
    CODETRUST_LANGUAGE: ""
    CODETRUST_SCAN_PATH: "."
  before_script:
    - pip install --quiet codetrust
    - codetrust --version || echo "CodeTrust installed"
  script:
    # Detect changed files for merge request pipelines
    - |
      SCAN_TARGET="${CODETRUST_SCAN_PATH}"
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        CHANGED=$(git diff --name-only --diff-filter=ACM "${CI_MERGE_REQUEST_DIFF_BASE_SHA}...HEAD" | grep -E '\.(py|js|ts|tsx|jsx|go|rs|java|sh)$' || true)
        if [ -n "${CHANGED}" ]; then
          echo "Merge request mode: scanning changed files only"
          echo "${CHANGED}"
          SCAN_TARGET="${CHANGED}"
        fi
      fi

    # Build scan command
    - |
      SCAN_CMD="codetrust scan --format json --fail-on ${CODETRUST_FAIL_ON}"
      if [ "${CODETRUST_SCAN_TYPE}" = "deep" ]; then
        SCAN_CMD="${SCAN_CMD} --deep"
      fi
      if [ -n "${CODETRUST_LANGUAGE}" ]; then
        SCAN_CMD="${SCAN_CMD} --language ${CODETRUST_LANGUAGE}"
      fi

    # Run scan and capture output
    - |
      set +e
      ${SCAN_CMD} ${SCAN_TARGET} > codetrust-results.json 2>&1
      SCAN_EXIT=$?
      set -e

    # Generate SARIF report
    - codetrust scan --format sarif --output codetrust-results.sarif ${SCAN_TARGET} || true

    # Parse and display results
    - |
      if command -v python3 > /dev/null 2>&1; then
        python3 -c "
      import json, sys
      try:
          data = json.load(open('codetrust-results.json'))
          verdict = data.get('verdict', 'UNKNOWN')
          total = data.get('total_findings', 0)
          blocks = data.get('blocks', 0)
          warns = data.get('warnings', 0)
          print('=' * 50)
          print(f'CodeTrust Verdict: {verdict}')
          print(f'Total findings: {total}')
          print(f'  BLOCK: {blocks}  WARN: {warns}')
          print('=' * 50)
          for f in data.get('findings', []):
              sev = f.get('severity', 'INFO')
              print(f'[{sev}] {f.get(\"file\", \"?\")}:{f.get(\"line\", 0)} -- {f.get(\"rule_id\", \"?\")} {f.get(\"message\", \"\")}')
      except Exception as e:
          print(f'Warning: could not parse results: {e}')
          sys.exit(0)
      "
      fi

    # Fail if scan threshold exceeded
    - |
      if [ ${SCAN_EXIT} -ne 0 ]; then
        echo "CodeTrust: findings exceed '${CODETRUST_FAIL_ON}' threshold"
        exit 1
      fi
  artifacts:
    paths:
      - codetrust-results.json
      - codetrust-results.sarif
    reports:
      sast:
        - codetrust-results.sarif
    when: always
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Ready-to-use job — add to your pipeline stages
codetrust:
  extends: .codetrust-scan
  stage: test
  allow_failure: false
