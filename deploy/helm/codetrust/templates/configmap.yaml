apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codetrust.fullname" . }}-config
  labels:
    {{- include "codetrust.labels" . | nindent 4 }}
data:
  CODETRUST_HOST: {{ .Values.config.host | quote }}
  CODETRUST_PORT: {{ .Values.config.port | quote }}
  CODETRUST_DEBUG: {{ .Values.config.debug | quote }}
  CODETRUST_DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  CODETRUST_REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CODETRUST_REDIS_ENABLED: {{ .Values.config.redisEnabled | quote }}
  CODETRUST_FREE_TIER_DAILY_LIMIT: {{ .Values.config.freeTierDailyLimit | quote }}
  CODETRUST_PRO_TIER_DAILY_LIMIT: {{ .Values.config.proTierDailyLimit | quote }}
  CODETRUST_SANDBOX_ENABLED: {{ .Values.config.sandboxEnabled | quote }}
