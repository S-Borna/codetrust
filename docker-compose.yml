version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CODETRUST_HOST=0.0.0.0
      - CODETRUST_PORT=8000
      - CODETRUST_DEBUG=false
      - CODETRUST_REDIS_URL=redis://redis:6379
      - CODETRUST_REDIS_ENABLED=true
      - CODETRUST_API_KEY=${CODETRUST_API_KEY:-}
      - CODETRUST_DATABASE_URL=postgresql+asyncpg://codetrust:codetrust@postgres:5432/codetrust
      - CODETRUST_STRIPE_SECRET_KEY=${CODETRUST_STRIPE_SECRET_KEY:-}
      - CODETRUST_STRIPE_WEBHOOK_SECRET=${CODETRUST_STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: codetrust
      POSTGRES_PASSWORD: codetrust
      POSTGRES_DB: codetrust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrust"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
