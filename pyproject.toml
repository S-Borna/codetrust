[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codetrust"
version = "2.1.0"
description = "AI code safety platform — 132 rules across 10 enforcement layers. Three moats no linter has: (1) AI Governance Gateway with 57 real-time interception rules, (2) Live registry verification catches hallucinated imports against PyPI/npm, (3) AI Trust Score with baseline trending. Pre-execution gateway blocks destructive AI agent actions. CLI, GitHub Action, MCP server, and VS Code extension."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
authors = [
    { name = "Said Borna", email = "codetrust@users.noreply.github.com" },
]
keywords = ["mcp", "code-quality", "verification", "hallucination", "claude-code", "devops", "react", "kubernetes", "sarif", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # MCP server
    "mcp[cli]>=1.0.0",
    # Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # HTTP client
    "httpx>=0.27.0",
    # Cache
    "redis[hiredis]>=5.0.0",
    # Logging
    "structlog>=24.0.0",
    # AST parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Billing
    "stripe>=7.0.0",
    # Auth
    "PyJWT>=2.8.0",
    # Migrations
    "alembic>=1.13.0",
    # Sync DB driver for Alembic migrations
    "psycopg2-binary>=2.9.0",
]

[project.urls]
Homepage = "https://codetrust.saidborna.com"
Repository = "https://github.com/S-Borna/codetrust"
Documentation = "https://codetrust.saidborna.com"
"Bug Tracker" = "https://github.com/S-Borna/codetrust/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "fakeredis[json]>=2.20.0",
    "ruff>=0.5.0",
    "httpx[cli]>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
codetrust = "src.cli:main"
codetrust-mcp = "src.server:mcp.run"
codetrust-api = "src.api:run"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 is standard FastAPI pattern

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/__pycache__/*", "src/templates/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
