[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codetrust"
version = "2.3.2"
description = "AI code safety platform — 133 rules, 10 enforcement layers, 3 moats no other tool has. AI Governance Gateway blocks destructive AI agent actions before execution (57 real-time rules). Hallucination Detection verifies every import against PyPI/npm/crates.io/Go proxy. Trust Score tracks code safety drift over time. 27 API endpoints, 17 MCP tools, 1358 tests. CLI, VS Code extension, GitHub Action, and MCP server."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
authors = [
    { name = "Said Borna", email = "codetrust@saidborna.com" },
]
keywords = ["mcp", "ai-safety", "governance", "code-quality", "verification", "hallucination", "claude-code", "cursor", "devops", "react", "kubernetes", "sarif", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # MCP server
    "mcp[cli]>=1.0.0",
    # Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # HTTP client
    "httpx>=0.27.0",
    # Cache
    "redis[hiredis]>=5.0.0",
    # Logging
    "structlog>=24.0.0",
    # AST parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Billing
    "stripe>=7.0.0",
    # Auth
    "PyJWT>=2.8.0",
    # Migrations
    "alembic>=1.13.0",
    # Sync DB driver for Alembic migrations
    "psycopg2-binary>=2.9.0",
]

[project.urls]
Homepage = "https://codetrust.saidborna.com"
Documentation = "https://codetrust.saidborna.com"
Support = "https://codetrust.saidborna.com"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "fakeredis[json]>=2.20.0",
    "ruff>=0.5.0",
    "httpx[cli]>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
codetrust = "src.cli:main"
codetrust-mcp = "src.server:mcp.run"
codetrust-api = "src.api:run"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 is standard FastAPI pattern

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/__pycache__/*", "src/templates/*", "src/cli.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [
    "dashboard/",
    "extension/",
    "docs/",
    "sandbox/",
    "deploy/",
    ".github/",
    "tests/",
    "__pycache__/",
    "*.pyc",
    "codetrust/",
    "node_modules/",
]
