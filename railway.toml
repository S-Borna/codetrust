[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c 'for i in 1 2 3 4 5; do alembic upgrade head && break || sleep $((i*5)); done; exec uvicorn src.api:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/v1/status"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
