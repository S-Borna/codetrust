[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "timeout 30 alembic upgrade head || true"
startCommand = "/bin/sh -c \"exec uvicorn src.api:app --host 0.0.0.0 --port $PORT\""
healthcheckPath = "/v1/status"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
